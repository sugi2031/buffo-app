<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>buffoEgg's App</title>
<link rel="apple-touch-icon" sizes="180x180" href="buffo_icon_180.png">
<link rel="icon" type="image/png" sizes="180x180" href="buffo_icon_180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="buffoEgg">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,"Hiragino Maru Gothic Pro",sans-serif;background:#F6FAF0;color:#1A3A1A;font-size:16px;padding-bottom:60px;-webkit-text-size-adjust:100%;}
.hd{background:#2D6A2D;padding:16px;padding-bottom:40px;position:relative;overflow:hidden;}
.hd::after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:24px;background:#F6FAF0;border-radius:50% 50% 0 0/24px 24px 0 0;}
.hd-in{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
.hd h1{font-size:20px;font-weight:800;color:#fff;}
.hd p{font-size:11px;color:rgba(255,255,255,.8);margin-top:2px;}
.tb-wrap{background:#F6FAF0;padding:10px 14px 6px;}
.tb{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:12px;padding:4px;gap:3px;}
.tab{padding:10px 0;font-size:12px;font-weight:800;color:#5A8A5A;background:none;border:none;cursor:pointer;border-radius:9px;line-height:1.4;font-family:inherit;-webkit-appearance:none;}
.tab.on{background:#2D6A2D;color:#fff;}
.pg{display:none;padding:12px 14px;}.pg.on{display:block;}
.dr{display:flex;gap:8px;margin-bottom:14px;}
.dr input[type=date]{flex:1;padding:13px 12px;border:2px solid #C0DCC0;border-radius:10px;font-size:16px;background:#fff;-webkit-appearance:none;font-family:inherit;}
.btn-t{padding:13px 16px;background:#D0EAD0;border:2px solid #C0DCC0;border-radius:10px;font-size:14px;font-weight:800;color:#2D6A2D;cursor:pointer;white-space:nowrap;font-family:inherit;-webkit-appearance:none;}
.stl{font-size:14px;font-weight:800;color:#1A4A1A;margin-bottom:10px;}
.rg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.rb{background:#fff;border:2.5px solid #C0DCC0;border-radius:14px;padding:16px 4px 12px;text-align:center;position:relative;font-family:inherit;cursor:pointer;-webkit-appearance:none;touch-action:manipulation;}
.rb.on{border-color:#3D8A3D;background:#EAF5EA;}
.rb .rn{font-size:26px;font-weight:800;color:#2D6A2D;display:block;line-height:1;}
.rb .rs{font-size:11px;color:#5A8A5A;margin-top:4px;font-weight:700;display:block;}
.rb .bdg{position:absolute;top:-7px;right:-7px;background:#F5E100;color:#1A4A1A;font-size:10px;font-weight:800;min-width:20px;height:20px;padding:0 3px;border-radius:10px;display:none;align-items:center;justify-content:center;border:2px solid #F6FAF0;}
.sel-b{display:inline-block;background:#2D6A2D;color:#fff;padding:9px 18px;border-radius:22px;font-size:15px;font-weight:800;margin-bottom:12px;}
.card{background:#fff;border-radius:16px;border:1.5px solid #C0DCC0;padding:16px;margin-bottom:12px;}
.ct{font-size:14px;font-weight:800;color:#2D6A2D;margin-bottom:14px;padding-bottom:10px;border-bottom:1.5px dashed #C0DCC0;}
.fi{margin-bottom:13px;}.fi:last-child{margin-bottom:0;}
.fi label{display:block;font-size:12px;font-weight:800;color:#5A8A5A;margin-bottom:7px;}
.fi input[type=text],.fi textarea,.fi select{width:100%;padding:13px 14px;border:2px solid #C0DCC0;border-radius:10px;font-size:16px;background:#EAF5EA;font-family:inherit;-webkit-appearance:none;}
.fi textarea{resize:none;height:72px;}
.num-input{width:100%;padding:14px;border:2px solid #B5DDB5;border-radius:10px;font-size:36px;font-weight:800;color:#2D6A2D;background:#fff;text-align:center;font-family:inherit;-webkit-appearance:none;-moz-appearance:textfield;display:block;}
.num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.num-input:focus{outline:none;border-color:#3D8A3D;background:#EAF5EA;}
.num-input.brk{color:#C0392B;border-color:#FFB5B5;}.num-input.brk:focus{background:#FFF0F0;}
.btn-save{width:100%;padding:18px;background:#2D6A2D;color:#fff;border:none;border-radius:16px;font-size:18px;font-weight:800;cursor:pointer;margin-top:6px;font-family:inherit;-webkit-appearance:none;touch-action:manipulation;}
.btn-save:active{background:#1A4A1A;}.btn-save:disabled{background:#A0C0A0;cursor:not-allowed;}
.sw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.st{width:100%;border-collapse:collapse;font-size:13px;min-width:360px;}
.st th{background:#2D6A2D;color:#fff;font-weight:800;padding:10px 6px;text-align:center;font-size:11px;}
.st td{padding:9px 6px;text-align:center;border-bottom:1px solid #C0DCC0;}
.st td:first-child{text-align:left;font-weight:700;color:#5A8A5A;white-space:nowrap;}
.st .tot{font-weight:800;color:#2D6A2D;}
.st tr:nth-child(even) td{background:#EAF5EA;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:#1A4A1A;color:#fff;padding:13px 26px;border-radius:30px;font-size:15px;font-weight:700;opacity:0;transition:all .3s;z-index:9999;white-space:nowrap;pointer-events:none;font-family:inherit;}
.toast.ok{background:#3D8A3D;}.toast.ng{background:#C0392B;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.ld,.em{text-align:center;padding:48px 20px;color:#5A8A5A;font-size:15px;font-weight:600;}
.ee{font-size:52px;display:block;margin-bottom:10px;}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;display:none;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:#F6FAF0;border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:0 0 32px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;position:sticky;top:0;background:#F6FAF0;z-index:10;border-bottom:1px solid #C0DCC0;}
.modal-title{font-size:16px;font-weight:800;color:#1A4A1A;}
.modal-close{background:none;border:none;font-size:22px;color:#5A8A5A;cursor:pointer;padding:4px 8px;font-family:inherit;}
.rec-card{background:#fff;border:1.5px solid #C0DCC0;border-radius:14px;margin:10px 14px;overflow:hidden;}
.rec-card-h{background:#2D6A2D;color:#fff;padding:10px 14px;font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center;}
.rec-card-h .rc-total{font-size:20px;font-weight:800;}
.rec-card-body{padding:12px 14px;}
.rec-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}.rec-row:last-child{margin-bottom:0;}
.rec-row label{font-size:11px;font-weight:800;color:#5A8A5A;width:70px;flex-shrink:0;}
.rec-input{flex:1;padding:9px 12px;border:1.5px solid #C0DCC0;border-radius:8px;font-size:15px;background:#EAF5EA;font-family:inherit;-webkit-appearance:none;}
.rec-input:focus{outline:none;border-color:#2D6A2D;}
.rec-save-btn{width:calc(100% - 28px);margin:8px 14px 0;padding:14px;background:#2D6A2D;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}
.di{cursor:pointer;transition:background .15s;background:#fff;border:1.5px solid #C0DCC0;border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.di:active{background:#EAF5EA;}
.di .dt{font-size:14px;font-weight:800;color:#2D6A2D;}
.di .dd{font-size:11px;color:#5A8A5A;margin-top:3px;}
.di .dv{font-size:28px;font-weight:800;color:#2D6A2D;text-align:right;}
.di .du{font-size:11px;color:#5A8A5A;text-align:right;}
.st tr.month-row{cursor:pointer;}.st tr.month-row td{transition:background .15s;}.st tr.month-row td:first-child{color:#2D6A2D;text-decoration:underline dotted #2D6A2D;}
.month-modal-inner{padding:0 12px 12px;}
.month-banner{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;}
.month-card-g{background:#2D6A2D;color:#fff;border-radius:12px;padding:12px;text-align:center;}
.month-card-w{background:#fff;border:1.5px solid #C0DCC0;color:#1A4A1A;border-radius:12px;padding:12px;text-align:center;}
.mc-lb{font-size:10px;opacity:.85;font-weight:bold;margin-bottom:3px;}.mc-vl{font-size:26px;font-weight:800;line-height:1;}.mc-un{font-size:10px;opacity:.8;margin-top:2px;}
.mn-banner{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.mn-card{background:#2D6A2D;border-radius:14px;padding:14px;text-align:center;color:#fff;}
.mn-card.sub{background:#fff;border:1.5px solid #C0DCC0;color:#1A4A1A;}
.mn-card .mn-label{font-size:11px;opacity:.85;font-weight:700;margin-bottom:4px;}
.mn-card .mn-val{font-size:32px;font-weight:800;line-height:1;}
.mn-card .mn-unit{font-size:13px;opacity:.8;margin-top:2px;}
.sale-banner{background:#2D6A2D;border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.sale-banner .sb-label{font-size:13px;color:rgba(255,255,255,.85);font-weight:700;}
.sale-banner .sb-val{font-size:26px;font-weight:800;color:#fff;white-space:nowrap;}
.sub-tb{display:flex;gap:6px;margin-bottom:14px;}
.sub-tab{flex:1;padding:10px;background:#fff;border:2px solid #C0DCC0;border-radius:10px;font-size:13px;font-weight:800;color:#5A8A5A;cursor:pointer;font-family:inherit;-webkit-appearance:none;text-align:center;}
.sub-tab.on{background:#2D6A2D;color:#fff;border-color:#2D6A2D;}
.sz-item-wrap{margin-bottom:4px;}
.sz-name{width:100%;padding:10px 12px;border:2px solid #C0DCC0;border-radius:10px;font-size:15px;background:#EAF5EA;font-family:inherit;-webkit-appearance:none;}
.sz-qty{width:100%;padding:10px 8px;border:2px solid #C0DCC0;border-radius:10px;font-size:15px;background:#EAF5EA;font-family:inherit;text-align:center;-webkit-appearance:none;-moz-appearance:textfield;}
.sz-qty::-webkit-outer-spin-button,.sz-qty::-webkit-inner-spin-button{-webkit-appearance:none;}
.sz-unit{width:100%;padding:10px 6px;border:2px solid #C0DCC0;border-radius:10px;font-size:14px;background:#EAF5EA;font-family:inherit;-webkit-appearance:none;}
.sz-price{width:100%;padding:10px 12px;border:2px solid #C0DCC0;border-radius:10px;font-size:15px;background:#EAF5EA;font-family:inherit;-webkit-appearance:none;-moz-appearance:textfield;}
.sz-price::-webkit-outer-spin-button,.sz-price::-webkit-inner-spin-button{-webkit-appearance:none;}
.sz-month{background:#fff;border:1.5px solid #C0DCC0;border-radius:14px;margin-bottom:12px;overflow:hidden;}
.sz-month-h{background:#2D6A2D;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;}
.sz-month-body{padding:10px 14px;}
.sz-item{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #EAF5EA;font-size:13px;}.sz-item:last-child{border-bottom:none;}
.sz-total{font-weight:800;color:#2D6A2D;padding-top:6px;text-align:right;font-size:13px;}
#milestone-banner{display:none;background:linear-gradient(135deg,#FFD700,#FFA500);color:#1A3A00;text-align:center;padding:14px 16px;font-size:18px;font-weight:800;letter-spacing:.5px;animation:mpulse 2s ease-in-out infinite;}
@keyframes mpulse{0%,100%{opacity:1}50%{opacity:.82}}
.mode-toggle{display:flex;gap:6px;margin-bottom:14px;}
.mode-btn{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;-webkit-appearance:none;border:2px solid #C0DCC0;background:#fff;color:#5A8A5A;transition:all .2s;}
.mode-btn.on{background:#2D6A2D;color:#fff;border-color:#2D6A2D;}
/* 音声ステップUI */
.vs-step-box{background:#fff;border:2.5px solid #2D6A2D;border-radius:16px;padding:20px 16px;margin-bottom:12px;text-align:center;}
.vs-step-box.listening{border-color:#C0392B;animation:vpulse 1.5s ease-in-out infinite;}
@keyframes vpulse{0%,100%{opacity:1}50%{opacity:.55}}
.vs-step-label{font-size:12px;color:#5A8A5A;font-weight:700;margin-bottom:6px;}
.vs-step-q{font-size:24px;font-weight:800;color:#2D6A2D;margin-bottom:8px;}
.vs-step-q.listening{color:#C0392B;}
.vs-step-progress{display:flex;gap:4px;justify-content:center;margin-bottom:12px;}
.vs-step-dot{width:12px;height:12px;border-radius:50%;background:#C0DCC0;}
.vs-step-dot.done{background:#2D6A2D;}.vs-step-dot.active{background:#C0392B;animation:vpulse 1s ease-in-out infinite;}
.vs-step-result{font-size:40px;font-weight:800;color:#2D6A2D;min-height:50px;line-height:1;}
.vs-step-raw{font-size:11px;color:#A0C0A0;margin-top:6px;}
.vs-step-btns{display:flex;gap:8px;margin-top:14px;justify-content:center;}
.vs-step-skip{padding:12px 24px;background:#D0EAD0;border:2px solid #C0DCC0;border-radius:12px;font-size:14px;font-weight:800;color:#2D6A2D;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.vs-step-retry{padding:12px 24px;background:#fff;border:2px solid #C0DCC0;border-radius:12px;font-size:14px;font-weight:800;color:#5A8A5A;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.vs-controls{display:flex;gap:8px;margin-bottom:12px;}
.vs-btn-start{flex:2;padding:16px;background:#C0392B;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;-webkit-appearance:none;touch-action:manipulation;transition:background .2s;}
.vs-btn-start.active{background:#7B241C;}
.vs-btn-clear{flex:1;padding:16px;background:#fff;color:#5A8A5A;border:2px solid #C0DCC0;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;-webkit-appearance:none;touch-action:manipulation;}
.vs-preview{display:none;background:#fff;border:2.5px solid #2D6A2D;border-radius:16px;margin-bottom:12px;overflow:hidden;}
.vs-preview-h{background:#2D6A2D;color:#fff;padding:10px 14px;font-size:13px;font-weight:800;}
.vs-preview-body{padding:12px 14px;}
.vs-preview-nums{display:flex;gap:6px;margin-top:4px;}
.vs-preview-field{flex:1;text-align:center;}
.vs-preview-field label{display:block;font-size:10px;color:#5A8A5A;font-weight:800;margin-bottom:4px;}
.vs-preview-inp{width:100%;padding:10px 2px;border:1.5px solid #C0DCC0;border-radius:8px;font-size:22px;font-weight:800;color:#2D6A2D;background:#EAF5EA;text-align:center;font-family:inherit;-webkit-appearance:none;-moz-appearance:textfield;}
.vs-preview-inp::-webkit-outer-spin-button,.vs-preview-inp::-webkit-inner-spin-button{-webkit-appearance:none;}
.vs-preview-inp.brk{color:#C0392B;border-color:#FFB5B5;background:#FFF0F0;}
.vs-preview-btns{display:flex;gap:8px;margin-top:12px;}
.vs-preview-ok{flex:2;padding:16px;background:#2D6A2D;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.vs-preview-ng{flex:1;padding:16px;background:#fff;color:#5A8A5A;border:2px solid #C0DCC0;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.vs-preview-room{background:#2D6A2D;color:#fff;padding:6px 14px;border-radius:20px;font-size:16px;font-weight:800;display:inline-block;margin-bottom:10px;}
.vs-card{background:#fff;border:1.5px solid #C0DCC0;border-radius:14px;margin-bottom:8px;overflow:hidden;}
.vs-card-h{background:#2D6A2D;color:#fff;padding:10px 14px;font-size:14px;font-weight:800;display:flex;justify-content:space-between;align-items:center;}
.vs-card-total{font-size:20px;font-weight:800;}
.vs-card-del{background:none;border:none;color:rgba(255,255,255,.6);font-size:20px;cursor:pointer;padding:0 0 0 8px;line-height:1;font-family:inherit;}
.vs-card-body{display:flex;gap:6px;padding:12px 14px;}
.vs-field{flex:1;text-align:center;}
.vs-field label{display:block;font-size:10px;color:#5A8A5A;font-weight:800;margin-bottom:4px;}
.vs-inp{width:100%;padding:10px 2px;border:1.5px solid #C0DCC0;border-radius:8px;font-size:22px;font-weight:800;color:#2D6A2D;background:#EAF5EA;text-align:center;font-family:inherit;-webkit-appearance:none;-moz-appearance:textfield;}
.vs-inp::-webkit-outer-spin-button,.vs-inp::-webkit-inner-spin-button{-webkit-appearance:none;}
.vs-inp.brk{color:#C0392B;border-color:#FFB5B5;background:#FFF0F0;}
.vs-save-all{width:100%;padding:18px;background:#2D6A2D;color:#fff;border:none;border-radius:16px;font-size:18px;font-weight:800;cursor:pointer;font-family:inherit;-webkit-appearance:none;touch-action:manipulation;margin-top:4px;}
.vs-save-all:disabled{background:#A0C0A0;cursor:not-allowed;}
.vs-empty{text-align:center;color:#A0C0A0;font-size:13px;padding:16px 0;}
/* スケルトンローディング */
.skel{background:linear-gradient(90deg,#EAF5EA 25%,#D0EAD0 50%,#EAF5EA 75%);background-size:200% 100%;animation:skel 1.2s infinite;border-radius:8px;height:60px;margin-bottom:8px;}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="hd">
  <div id="weather-bar" style="background:rgba(255,255,255,0.13);border-radius:14px;padding:8px 14px;margin-bottom:10px;position:relative;z-index:1;">
    <div style="font-size:11px;color:rgba(255,255,255,.7);font-weight:700;margin-bottom:4px;">📍 北広島町 天気予報</div>
    <div id="wx-forecast" style="display:flex;gap:6px;"><div style="color:#fff;font-size:12px;font-weight:600;">取得中...</div></div>
  </div>
  <div class="hd-in">
    <img src="buffo_icon_180.png" alt="buffo" style="width:48px;height:48px;border-radius:12px;object-fit:cover;flex-shrink:0;">
    <div><h1>buffoEgg's App</h1><p>ふぁーむbuffo　産卵・給餌管理</p></div>
  </div>
</div>
<div class="tb-wrap"><div class="tb">
  <button class="tab on" onclick="sw('record')">🥚<br>産卵・給餌</button>
  <button class="tab" onclick="sw('today')">📋<br>産卵合計<br>・平均</button>
  <button class="tab" onclick="sw('sale')">🛒<br>販売</button>
  <button class="tab" onclick="sw('summary')">📊<br>集計</button>
</div></div>
<div id="milestone-banner"></div>
<div id="pg-record" class="pg on">
  <div class="dr"><input type="date" id="record-date"><button class="btn-t" onclick="setToday('record-date')">今日</button></div>
  <div class="mode-toggle">
    <button class="mode-btn on" id="mode-manual" onclick="setMode('manual')">✏️ 手動入力</button>
    <button class="mode-btn" id="mode-voice" onclick="setMode('voice')">🎤 音声入力</button>
  </div>
  <div id="panel-manual">
    <p class="stl">● 号舎を選んでね</p>
    <div class="rg" id="room-grid"></div>
    <div id="form-area" style="display:none;">
      <div class="sel-b" id="sel-badge">🏠 1号舎</div>
      <div id="flock-bar" style="background:#fff;border:1.5px solid #C0DCC0;border-radius:14px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <div><div style="font-size:12px;color:#5A8A5A;font-weight:700;margin-bottom:2px;">🐔 鶏舎情報</div><div id="flock-info" style="font-size:14px;font-weight:800;color:#1A4A1A;">入舎データなし</div></div>
        <button onclick="toggleFlockPanel()" style="background:#D0EAD0;border:1.5px solid #C0DCC0;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:800;color:#2D6A2D;cursor:pointer;font-family:inherit;white-space:nowrap;" id="flock-toggle-btn">＋ 更新</button>
      </div>
      <div id="flock-panel" style="display:none;">
        <div class="card" style="border-color:#B5DDB5;">
          <div class="ct" style="color:#1A4A1A;">🐔 鶏舎情報の登録・更新</div>

<script>
var GAS_API_URL='https://script.google.com/macros/s/AKfycbyT3R_54xZOcX1Trb-6ltqVMrgMW0CWgSgm_Co0LSPlZAQFBqQRr96mRlpEJs9S5vTJ/exec';

// ============================================================
// ★ キャッシュ層（GETレスポンスをメモリに保持）
// ============================================================
var GAS_CACHE={};
var CACHE_TTL={
  'getMonthlyDailyRecords':30000,  // 30秒
  'getTodayRecords':30000,
  'getMonthlySummary':60000,       // 1分
  'getMonthlySaleTotal':60000,
  'getShizaiSummary':60000,
  'getMonthlyDailyByYearMonth':120000, // 2分
  'getDayDetail':60000,
  'getWeatherForecast':300000,     // 5分
  'getFlockInfo':30000
};
function cacheKey(action,params){return action+'|'+JSON.stringify(params||{});}
function cacheGet(action,params){
  var k=cacheKey(action,params),ttl=CACHE_TTL[action]||30000;
  if(GAS_CACHE[k]&&(Date.now()-GAS_CACHE[k].t)<ttl) return GAS_CACHE[k].d;
  return null;
}
function cacheSet(action,params,data){GAS_CACHE[cacheKey(action,params)]={d:data,t:Date.now()};}
function cacheInvalidate(patterns){
  Object.keys(GAS_CACHE).forEach(function(k){
    patterns.forEach(function(p){if(k.indexOf(p)!==-1)delete GAS_CACHE[k];});
  });
}

// ============================================================
// GAS API 呼び出し（GETはキャッシュ優先）
// ============================================================
function callGAS(a,p,m){
  p=p||{};m=m||'GET';
  if(m==='GET'){
    var cached=cacheGet(a,p);
    if(cached!==null) return Promise.resolve(cached);
  }
  return new Promise(function(ok,ng){
    if(m==='GET'){
      var q=['action='+encodeURIComponent(a)];
      Object.keys(p).forEach(function(k){q.push(encodeURIComponent(k)+'='+encodeURIComponent(p[k]==null?'':p[k]));});
      fetch(GAS_API_URL+'?'+q.join('&'))
        .then(function(r){return r.json();})
        .then(function(j){
          if(j.success!==false){cacheSet(a,p,j.data);ok(j.data);}
          else ng(new Error(j.error||'GAS error'));
        }).catch(ng);
    } else {
      var fd=new FormData();fd.append('action',a);
      Object.keys(p).forEach(function(k){var v=p[k];fd.append(k,typeof v==='object'?JSON.stringify(v):String(v==null?'':v));});
      fetch(GAS_API_URL,{method:'POST',body:fd})
        .then(function(r){return r.json();})
        .then(function(j){
          if(j.success!==false)ok(j.data);
          else ng(new Error(j.error||'GAS error'));
        }).catch(ng);
    }
  });
}

// ★ GASウォームアップ（起動時にpingして眠りを覚ます）
function warmGAS(){
  fetch(GAS_API_URL+'?action=ping').catch(function(){});
}

var sel="",rooms=["1号舎","2号舎","3号舎","4号舎","5号舎","6号舎","7号舎"];

function init(){
  setToday("record-date");setToday("sale-date");
  buildGrid();buildSzRows();setSzThisMonth();
  var d=new Date();
  document.getElementById("today-label").textContent=d.getFullYear()+"年"+(d.getMonth()+1)+"月の日別産卵記録";
  // ★ ウォームアップ → 天気取得 → バックグラウンドでデータ先読み
  warmGAS();
  loadWeather();
  // バックグラウンドで当月データを先読み（タブ切替を速くする）
  setTimeout(function(){
    callGAS('getMonthlyDailyRecords').catch(function(){});
    callGAS('getMonthlySaleTotal').catch(function(){});
    callGAS('getTodayRecords').catch(function(){});
  },2000);
  checkAndShowMilestoneBanner();
}

function buildSzRows(){var c=document.getElementById("sz-rows"),h="";for(var i=0;i<2;i++){if(i>0)h+='<div style="height:1px;background:#EAF5EA;margin:8px 0;"></div>';h+='<div class="sz-item-wrap"><div style="margin-bottom:5px;"><div style="font-size:10px;color:#5A8A5A;font-weight:700;margin-bottom:3px;">資材名</div><input class="sz-name" type="text" placeholder="例：配合飼料" data-sz="name"></div><div style="display:flex;gap:6px;align-items:flex-end;"><div style="flex:1;"><div style="font-size:10px;color:#5A8A5A;font-weight:700;margin-bottom:3px;">数量</div><input class="sz-qty" type="number" placeholder="0" inputmode="numeric" data-sz="qty"></div><div><div style="font-size:10px;color:#5A8A5A;font-weight:700;margin-bottom:3px;">単位</div><select class="sz-unit" data-sz="unit"><option>kg</option><option>g</option><option>袋</option><option>個</option><option>L</option><option>本</option><option>箱</option><option>枚</option><option>その他</option></select></div><div style="flex:1.5;"><div style="font-size:10px;color:#5A8A5A;font-weight:700;margin-bottom:3px;">金額（円）</div><input class="sz-price" type="number" oninput="calcSzTotal()" placeholder="¥0" inputmode="numeric" data-sz="price"></div></div></div>';}c.innerHTML=h;}
function setSzThisMonth(){var d=new Date();document.getElementById("sz-month").value=d.getFullYear()+"-"+pad(d.getMonth()+1);}
function setMode(mode){document.getElementById("panel-manual").style.display=mode==='manual'?'block':'none';document.getElementById("panel-voice").style.display=mode==='voice'?'block':'none';document.getElementById("mode-manual").className='mode-btn'+(mode==='manual'?' on':'');document.getElementById("mode-voice").className='mode-btn'+(mode==='voice'?' on':'');if(mode==='manual')stopVoiceSession();}
function loadWeather(){
  callGAS('getWeatherForecast').then(function(f){
    var el=document.getElementById("wx-forecast");
    if(!f||!f.length){el.innerHTML='<div style="color:rgba(255,255,255,.7);font-size:12px;">取得失敗</div>';return;}
    var days=["今日","明日","明後日"],h="";
    for(var i=0;i<Math.min(3,f.length);i++){var d=f[i];h+='<div style="flex:1;background:rgba(255,255,255,0.12);border-radius:10px;padding:6px 4px;text-align:center;"><div style="font-size:11px;color:rgba(255,255,255,.75);font-weight:700;">'+days[i]+'</div><div style="font-size:22px;line-height:1.2;">'+d.emoji+'</div><div style="font-size:10px;color:#fff;font-weight:700;">'+d.label+'</div><div style="font-size:11px;color:rgba(255,255,255,.9);margin-top:2px;"><span style="color:#FFD700;">↑'+d.tempMax+'</span> <span style="color:#AEE4FF;">↓'+d.tempMin+'</span></div><div style="font-size:10px;color:rgba(255,255,255,.65);">🌧'+d.precip+'mm</div></div>';}
    el.innerHTML=h;
  }).catch(function(){document.getElementById("wx-forecast").innerHTML='<div style="color:rgba(255,255,255,.7);font-size:12px;">天気取得失敗</div>';});
}
function setToday(id){var d=new Date();document.getElementById(id).value=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function pad(n){return String(n).padStart(2,"0");}
function buildGrid(){var g=document.getElementById("room-grid");g.innerHTML="";for(var i=0;i<rooms.length;i++){(function(room,num){var b=document.createElement("button");b.className="rb";b.id="rb-"+room;b.innerHTML='<span class="rn">'+num+'</span><span class="rs">号舎</span><span class="bdg" id="bd-'+room+'">0</span>';b.addEventListener("click",function(){pick(room);});g.appendChild(b);})(rooms[i],i+1);}}
function pick(room){sel=room;for(var i=0;i<rooms.length;i++){var b=document.getElementById("rb-"+rooms[i]);if(b){rooms[i]===room?b.classList.add("on"):b.classList.remove("on");}}document.getElementById("sel-badge").textContent="🏠 "+room;document.getElementById("form-area").style.display="block";document.getElementById("ne").value=0;document.getElementById("he").value=0;document.getElementById("ke").value=0;document.getElementById("memo").value="";loadFlockInfo(room);setTimeout(function(){document.getElementById("form-area").scrollIntoView({behavior:"smooth",block:"start"});},100);}

// ★ 保存：フォームを即リセット、GAS応答を待たずにUI更新
function doSave(){
  if(!sel){toast("号舎を選んでね","ng");return;}
  var btn=document.getElementById("sub-btn");
  var params={date:document.getElementById("record-date").value,room:sel,
    normalEggs:document.getElementById("ne").value,hibiEggs:document.getElementById("he").value,
    kigaiEggs:document.getElementById("ke").value,feed:document.getElementById("feed").value,
    grass:document.getElementById("grass").value,other:document.getElementById("other").value,
    memo:document.getElementById("memo").value,recorder:document.getElementById("recorder").value};
  // ★ 即座にUIをリセット（楽観的UI）
  btn.disabled=true;btn.textContent="送信中...";
  document.getElementById("ne").value=0;document.getElementById("he").value=0;document.getElementById("ke").value=0;
  document.getElementById("feed").value="";document.getElementById("grass").value="";document.getElementById("other").value="";
  document.getElementById("memo").value="";
  toast("📤 保存中...","");
  // キャッシュ無効化
  cacheInvalidate(['getMonthlyDailyRecords','getTodayRecords','getMonthlySummary']);
  callGAS('saveRecord',params,'POST')
  .then(function(r){btn.disabled=false;btn.textContent="保存する";toast("✅ "+r.message,"ok");updateBadgesFromSave(sel,params);})
  .catch(function(e){btn.disabled=false;btn.textContent="保存する";toast("❌ "+(e.message||"通信エラー"),"ng");});
}

function updateBadgesFromSave(room,params){
  var n=parseInt(params.normalEggs)||0,h=parseInt(params.hibiEggs)||0,k=parseInt(params.kigaiEggs)||0;
  var el=document.getElementById("bd-"+room);
  if(el){var cur=parseInt(el.textContent)||0;el.textContent=cur+n+h+k;el.style.display="flex";}
}

function loadSaleBanner(){
  document.getElementById("sale-banner-val").textContent="取得中...";
  callGAS('getMonthlySaleTotal').then(function(r){
    if(r&&r.success!==false){document.getElementById("sale-banner-label").textContent=r.year+"年"+r.month+"月の販売合計";document.getElementById("sale-banner-val").textContent=r.total.toLocaleString()+" 円 💴";}

function doSaveSale(){

function loadToday(){
  // ★ キャッシュがあれば即表示

function stopVoiceSession(){vsActive=false;vsStep='idle';if(vsRec){vsRec.onresult=null;vsRec.onerror=null;vsRec.onend=null;try{vsRec.stop();}catch(e){}vsRec=null;}updateStepUI();updateStartBtn();}
function updateStartBtn(){var b=document.getElementById("vs-btn-start");if(vsActive){b.textContent="⏹ 録音停止";b.classList.add("active");}else{b.textContent="🎤 音声記録開始";b.classList.remove("active");}}
function updateStepUI(){var box=document.getElementById("vs-step-box"),qEl=document.getElementById("vs-step-q"),resEl=document.getElementById("vs-step-result"),rawEl=document.getElementById("vs-step-raw"),dotsEl=document.getElementById("vs-step-dots"),btnsEl=document.getElementById("vs-step-btns");if(vsStep==='idle'){box.className="vs-step-box";qEl.textContent="「音声記録開始」を押してください";qEl.className="vs-step-q";resEl.textContent="";rawEl.textContent="";dotsEl.innerHTML="";btnsEl.innerHTML="";return;}box.className="vs-step-box listening";qEl.textContent=STEP_LABELS[vsStep];qEl.className="vs-step-q listening";resEl.textContent="🎤 聞いてます...";rawEl.textContent=STEP_EXAMPLES[vsStep];var si=STEPS.indexOf(vsStep),dots="";for(var i=0;i<STEPS.length;i++){var cls=i<si?"vs-step-dot done":i===si?"vs-step-dot active":"vs-step-dot";dots+='<div class="'+cls+'"></div>';}dotsEl.innerHTML=dots;if(vsStep==='hibi'||vsStep==='kigai'){btnsEl.innerHTML='<button class="vs-step-skip" onclick="skipStep()">0個（なし）</button><button class="vs-step-retry" onclick="retryStep()">🔄 再認識</button>';}else{btnsEl.innerHTML='<button class="vs-step-retry" onclick="retryStep()">🔄 再認識</button>';}}
function vsListen(){if(!vsActive||vsStep==='idle')return;var SR=window.SpeechRecognition||window.webkitSpeechRecognition;vsRec=new SR();vsRec.lang='ja-JP';vsRec.interimResults=false;vsRec.maxAlternatives=3;
  vsRec.onresult=function(e){
    var texts=[];for(var i=0;i<e.results[0].length;i++)texts.push(normalizeNum(e.results[0][i].transcript));
    var text=texts[0];document.getElementById("vs-step-raw").textContent="認識：「"+text+"」";
    var num=extractNumber(texts),isZero=isZeroWord(texts);
    if(vsStep==='room'){if(num!==null&&num>=1&&num<=7){vsTemp.room=num+"号舎";document.getElementById("vs-step-result").textContent=vsTemp.room;toast("✅ "+vsTemp.room,"ok");setTimeout(function(){vsStep='normal';updateStepUI();vsListen();},700);}else{document.getElementById("vs-step-result").textContent="❌ 1〜7で言ってください";setTimeout(vsListen,1000);}}
    else if(vsStep==='normal'){if(num!==null&&num>=0){vsTemp.normal=num;document.getElementById("vs-step-result").textContent=num+"個";toast("✅ 普通 "+num+"個","ok");setTimeout(function(){vsStep='hibi';updateStepUI();vsListen();},700);}else{document.getElementById("vs-step-result").textContent="❌ 数字で言ってください";setTimeout(vsListen,1000);}}
    else if(vsStep==='hibi'){if(isZero){vsTemp.hibi=0;document.getElementById("vs-step-result").textContent="0個";toast("✅ ヒビ 0個","ok");setTimeout(function(){vsStep='kigai';updateStepUI();vsListen();},700);}else if(num!==null&&num>=0){vsTemp.hibi=num;document.getElementById("vs-step-result").textContent=num+"個";toast("✅ ヒビ "+num+"個","ok");setTimeout(function(){vsStep='kigai';updateStepUI();vsListen();},700);}else{document.getElementById("vs-step-result").textContent="❌ 数字 or「なし」";setTimeout(vsListen,1000);}}
    else if(vsStep==='kigai'){if(isZero){vsTemp.kigai=0;finishSteps();}else if(num!==null&&num>=0){vsTemp.kigai=num;finishSteps();}else{document.getElementById("vs-step-result").textContent="❌ 数字 or「なし」";setTimeout(vsListen,1000);}}
  };
  vsRec.onerror=function(e){if(e.error==="not-allowed"){toast("マイクの使用が許可されていません","ng");stopVoiceSession();}};
  vsRec.onend=function(){};
  vsRec.start();
}
function extractNumber(texts){for(var i=0;i<texts.length;i++){var m=texts[i].match(/(\d+)/);if(m)return parseInt(m[1]);}return null;}
function isZeroWord(texts){for(var i=0;i<texts.length;i++){if(texts[i].match(/なし|ナシ|無し|ゼロ|零|ない|ありません/))return true;}return false;}
function skipStep(){if(vsStep==='hibi'){vsTemp.hibi=0;toast("✅ ヒビ 0個","ok");vsStep='kigai';updateStepUI();vsListen();}else if(vsStep==='kigai'){vsTemp.kigai=0;finishSteps();}}
function retryStep(){if(vsRec){vsRec.onresult=null;vsRec.onerror=null;vsRec.onend=null;try{vsRec.stop();}catch(e){}vsRec=null;}updateStepUI();vsListen();}
function finishSteps(){document.getElementById("vs-step-result").textContent="✅ 入力完了";toast("✅ 規格外 "+vsTemp.kigai+"個","ok");vsStep='idle';if(vsRec){vsRec.onresult=null;vsRec.onerror=null;vsRec.onend=null;try{vsRec.stop();}catch(e){}vsRec=null;}setTimeout(showVsPreviewStep,600);}
function showVsPreviewStep(){var el=document.getElementById("vs-preview"),total=vsTemp.normal+vsTemp.hibi+vsTemp.kigai;var h='<div class="vs-preview-h">📋 '+vsTemp.room+' の記録を確認 → 「✅ 記録する」</div><div class="vs-preview-body"><span class="vs-preview-room">'+vsTemp.room+'</span><div class="vs-preview-nums"><div class="vs-preview-field"><label>普通</label><input class="vs-preview-inp" type="number" inputmode="numeric" id="vp-n" value="'+vsTemp.normal+'"></div><div class="vs-preview-field"><label>ヒビ</label><input class="vs-preview-inp brk" type="number" inputmode="numeric" id="vp-h" value="'+vsTemp.hibi+'"></div><div class="vs-preview-field"><label>規格外</label><input class="vs-preview-inp" type="number" inputmode="numeric" id="vp-k" value="'+vsTemp.kigai+'"></div></div></div><div class="vs-preview-btns"><button class="vs-preview-ok" onclick="confirmVsPreview()">✅ 記録する（計'+total+'個）</button><button class="vs-preview-ng" onclick="retryAllSteps()">🔄 やり直し</button></div>';el.innerHTML=h;el.style.display="block";el.scrollIntoView({behavior:"smooth",block:"nearest"});updateStepUI();updateStartBtn();}
function confirmVsPreview(){var p={room:vsTemp.room,normal:parseInt(document.getElementById("vp-n").value)||0,hibi:parseInt(document.getElementById("vp-h").value)||0,kigai:parseInt(document.getElementById("vp-k").value)||0};var room=p.room,isNew=!vsData[room];vsData[room]={normal:p.normal,hibi:p.hibi,kigai:p.kigai};if(isNew)vsOrder.push(room);renderVsLog();toast("✅ "+room+" 計"+(p.normal+p.hibi+p.kigai)+"個 記録しました","ok");document.getElementById("vs-preview").style.display="none";document.getElementById("vs-preview").innerHTML="";startVoiceSession();}
function retryAllSteps(){document.getElementById("vs-preview").style.display="none";document.getElementById("vs-preview").innerHTML="";startVoiceSession();}
function renderVsLog(){var el=document.getElementById("vs-log"),sb=document.getElementById("vs-save-all");if(!vsOrder.length){el.innerHTML='<div class="vs-empty">まだ記録がありません</div>';sb.disabled=true;return;}var h="";vsOrder.forEach(function(room){var d=vsData[room],total=(d.normal||0)+(d.hibi||0)+(d.kigai||0),rid=room.replace("号舎","");h+='<div class="vs-card"><div class="vs-card-h"><span>🏠 '+room+'</span><div style="display:flex;align-items:center;gap:4px;"><span class="vs-card-total" id="vst-'+rid+'">'+total+' 個</span><button class="vs-card-del" onclick="deleteVsRecord(\''+room+'\')">✕</button></div></div><div class="vs-card-body"><div class="vs-field"><label>普通</label><input class="vs-inp" type="number" inputmode="numeric" id="vsn-'+rid+'" value="'+d.normal+'" oninput="updateVsTotal(\''+room+'\',\''+rid+'\')"></div><div class="vs-field"><label>ヒビ</label><input class="vs-inp brk" type="number" inputmode="numeric" id="vsh-'+rid+'" value="'+d.hibi+'" oninput="updateVsTotal(\''+room+'\',\''+rid+'\')"></div><div class="vs-field"><label>規格外</label><input class="vs-inp" type="number" inputmode="numeric" id="vsk-'+rid+'" value="'+d.kigai+'" oninput="updateVsTotal(\''+room+'\',\''+rid+'\')"></div></div></div>';});el.innerHTML=h;sb.disabled=false;}
function updateVsTotal(room,rid){var n=parseInt(document.getElementById("vsn-"+rid).value)||0,h=parseInt(document.getElementById("vsh-"+rid).value)||0,k=parseInt(document.getElementById("vsk-"+rid).value)||0;vsData[room]={normal:n,hibi:h,kigai:k};var el=document.getElementById("vst-"+rid);if(el)el.textContent=(n+h+k)+" 個";}
function deleteVsRecord(room){delete vsData[room];vsOrder=vsOrder.filter(function(r){return r!==room;});renderVsLog();}
function clearVsSession(){stopVoiceSession();vsData={};vsOrder=[];renderVsLog();document.getElementById("vs-preview").style.display="none";document.getElementById("vs-preview").innerHTML="";}
function saveAllSession(){if(!vsOrder.length){toast("記録がありません","ng");return;}vsOrder.forEach(function(room){var rid=room.replace("号舎","");vsData[room]={normal:parseInt(document.getElementById("vsn-"+rid).value)||0,hibi:parseInt(document.getElementById("vsh-"+rid).value)||0,kigai:parseInt(document.getElementById("vsk-"+rid).value)||0};});var date=document.getElementById("record-date").value,rec=document.getElementById("vs-recorder").value;var sb=document.getElementById("vs-save-all");sb.disabled=true;sb.textContent="保存中...";
  // ★ キャッシュ無効化してから一括保存
  cacheInvalidate(['getMonthlyDailyRecords','getTodayRecords','getMonthlySummary']);
  Promise.all(vsOrder.map(function(room){var d=vsData[room];return callGAS('saveRecord',{date:date,room:room,normalEggs:d.normal,hibiEggs:d.hibi,kigaiEggs:d.kigai,feed:"",grass:"",other:"",memo:"[音声入力]",recorder:rec},'POST');}))
  .then(function(){toast("✅ "+vsOrder.length+"号舎分を保存しました","ok");clearVsSession();})
  .catch(function(e){toast("❌ "+(e.message||"保存エラー"),"ng");sb.disabled=false;sb.textContent="💾 全て保存する";});}

window.onload=init;
</script>
